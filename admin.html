<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orion MIS — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#1d1d1f;--white:#fff;--off:#f5f5f7;--border:#e2e2e7;--mid:#86868b;
  --blue:#0066cc;--blue-light:#2997ff;--blue-bg:#f0f6ff;
  --green:#00a86b;--green-bg:#edfaf4;
  --amber:#f59e0b;--amber-bg:#fff8eb;
  --red:#e53e3e;--red-bg:#fff5f5;
  --r:10px;--r-lg:16px;
  --sb:240px;
}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--dark);-webkit-font-smoothing:antialiased;overflow:hidden}

/* ── LOGIN GATE ── */
#gate{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}
.gate-card{background:white;border-radius:20px;padding:36px 36px 32px;width:100%;max-width:380px}
.gate-logo{font-family:'DM Serif Display',serif;font-size:32px;letter-spacing:-0.02em;text-align:center}
.gate-sub{font-size:13px;color:var(--mid);font-weight:300;text-align:center;margin-bottom:24px}
.gate-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;text-align:left}
.gate-row label{font-size:11px;font-weight:500;color:var(--mid);text-transform:uppercase;letter-spacing:0.05em}
.gate-row input{padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--r);font-family:inherit;font-size:14px;outline:none;transition:border 0.2s;width:100%;background:white;color:var(--dark)}
.gate-row input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,102,204,0.1)}
.gate-btn{width:100%;background:var(--dark);color:white;border:none;border-radius:980px;padding:13px;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;margin-top:6px}
.gate-btn:hover{background:#333}
.gate-btn:disabled{opacity:0.5;cursor:not-allowed}
.gate-msg{font-size:12px;margin-top:10px;text-align:center;min-height:18px;line-height:1.45}
.gate-msg.err{color:var(--red)}
.gate-msg.ok{color:var(--green)}
.gate-msg.info{color:var(--mid)}
.gate-links{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:12px}
.gate-links a{color:var(--blue);text-decoration:none}
.gate-links a:hover{text-decoration:underline}
.gate-hint{font-size:11px;color:var(--mid);text-align:center;margin-top:16px;line-height:1.5}

/* ── APP SHELL ── */
#app{display:none;height:100vh;overflow:hidden;background:var(--dark)}

/* ── SIDEBAR ── */
.sb{width:var(--sb);height:100vh;background:#111;position:fixed;left:0;top:0;display:flex;flex-direction:column;overflow-y:auto;z-index:100;border-right:1px solid rgba(255,255,255,0.06)}
.sb::-webkit-scrollbar{width:3px}.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1)}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.07)}
.sb-logo-m{font-family:'DM Serif Display',serif;font-size:20px;color:white;letter-spacing:-0.01em}
.sb-logo-s{font-size:10px;color:rgba(255,255,255,0.3);margin-top:1px;font-weight:300}
.sb-sec{padding:14px 14px 4px;font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.22)}
.nb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;margin:1px 6px;cursor:pointer;color:rgba(255,255,255,0.5);font-size:12.5px;background:none;border:none;width:calc(100% - 12px);text-align:left;font-family:inherit;transition:all 0.15s;position:relative}
.nb:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.nb.on{background:rgba(255,255,255,0.1);color:white}
.nb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nb .drafted{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,0.18)}
.sb-bot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,0.07)}
.sb-user{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:9px 11px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.sb-user .av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.sb-user .nm{font-size:11.5px;color:rgba(255,255,255,0.85);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-user .em{font-size:9.5px;color:rgba(255,255,255,0.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-pill{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:7px 10px;margin-bottom:8px;font-size:10px;color:rgba(255,255,255,0.4);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:#f59e0b}
.dot.ok{background:#22c55e}.dot.err{background:#ef4444}
.signout{width:100%;padding:7px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:8px;color:rgba(255,255,255,0.4);font-family:inherit;font-size:11px;cursor:pointer}
.signout:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}

/* ── MAIN PANE ── */
.main{margin-left:var(--sb);height:100vh;display:grid;grid-template-columns:minmax(380px,1fr) 1fr;overflow:hidden;background:#fafafb}

/* ── EDITOR PANE ── */
.ed{background:white;overflow-y:auto;border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.ed-header{padding:18px 24px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:white;z-index:10;flex-shrink:0}
.ed-title{font-family:'DM Serif Display',serif;font-size:24px;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px}
.ed-title .badge{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:0.04em;text-transform:uppercase}
.ed-title .badge.draft{background:var(--amber-bg);color:var(--amber)}
.ed-title .badge.live{background:var(--green-bg);color:var(--green)}
.ed-sub{font-size:12px;color:var(--mid);margin-top:2px;font-weight:300}
.ed-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:980px;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:transform 0.05s}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-dark{background:var(--dark);color:white}
.btn-dark:hover{background:#333}
.btn-blue{background:var(--blue);color:white}
.btn-blue:hover{background:#0058b3}
.btn-green{background:var(--green);color:white}
.btn-green:hover{background:#008f5a}
.btn-ghost{background:transparent;color:var(--mid);border-color:var(--border)}
.btn-ghost:hover{background:var(--off);color:var(--dark)}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red-bg)}
.btn-danger:hover{background:var(--red-bg)}
.ed-body{padding:18px 24px 60px;overflow-y:auto;flex:1}

/* ── FORM FIELDS ── */
.fld{margin-bottom:18px}
.fld-label{font-size:11.5px;font-weight:500;color:var(--dark);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.fld-label .req{color:var(--red)}
.fld-hint{font-size:11px;color:var(--mid);margin-bottom:6px;font-weight:300;line-height:1.45}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--r);font-family:inherit;font-size:13.5px;outline:none;transition:border 0.15s;background:white;color:var(--dark)}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,102,204,0.08)}
textarea.fi{min-height:80px;resize:vertical;line-height:1.5;font-family:inherit}
select.fi{cursor:pointer}
.fi.code{font-family:'SF Mono',Menlo,monospace;font-size:12px}

/* ── LIST WIDGET ── */
.list-wrap{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--off);padding:8px}
.list-empty{padding:18px;text-align:center;color:var(--mid);font-size:12px;font-weight:300}
.list-item{background:white;border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;overflow:hidden}
.list-head{display:flex;align-items:center;padding:9px 12px;cursor:pointer;gap:8px;user-select:none}
.list-head:hover{background:var(--off)}
.list-grip{color:var(--mid);font-size:12px;flex-shrink:0;cursor:grab}
.list-grip:active{cursor:grabbing}
.list-num{font-size:10px;font-weight:600;color:var(--mid);background:var(--off);padding:2px 7px;border-radius:999px;flex-shrink:0}
.list-summary{font-size:12.5px;font-weight:400;color:var(--dark);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.list-controls{display:flex;gap:2px;flex-shrink:0}
.list-ctrl{background:none;border:none;color:var(--mid);cursor:pointer;padding:4px;border-radius:6px;font-size:14px;line-height:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.list-ctrl:hover{background:var(--off);color:var(--dark)}
.list-ctrl.danger:hover{background:var(--red-bg);color:var(--red)}
.list-body{padding:14px 14px 6px;border-top:1px solid var(--border);background:var(--off);display:none}
.list-item.open .list-body{display:block}
.list-item.open .list-head{background:var(--off)}
.list-add{width:100%;padding:9px;background:white;border:1px dashed var(--border);border-radius:var(--r);color:var(--mid);font-family:inherit;font-size:12px;cursor:pointer;margin-top:4px}
.list-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}

/* ── IMAGE WIDGET ── */
.img-w{border:1.5px dashed var(--border);border-radius:var(--r-lg);padding:14px;text-align:center;background:var(--off);cursor:pointer;transition:all 0.15s;position:relative}
.img-w:hover,.img-w.drag{border-color:var(--blue);background:var(--blue-bg)}
.img-w.has{padding:8px}
.img-w img{max-width:100%;max-height:180px;border-radius:var(--r);display:block;margin:0 auto}
.img-w-hint{font-size:11.5px;color:var(--mid);font-weight:300}
.img-w-hint b{color:var(--dark);font-weight:500}
.img-w-row{display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.img-w input[type=file]{display:none}
.img-url{font-family:'SF Mono',Menlo,monospace;font-size:10.5px;color:var(--mid);word-break:break-all;margin-top:6px;padding:5px 8px;background:white;border-radius:6px;border:1px solid var(--border);text-align:left}

/* ── PREVIEW PANE ── */
.pv{background:#222;display:flex;flex-direction:column;min-width:0}
.pv-bar{background:#1a1a1a;padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap}
.pv-vp{display:flex;background:rgba(255,255,255,0.05);border-radius:7px;padding:2px}
.pv-vp button{background:none;border:none;color:rgba(255,255,255,0.5);padding:5px 11px;border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px}
.pv-vp button:hover{color:white}
.pv-vp button.on{background:rgba(255,255,255,0.12);color:white}
.pv-mode{display:flex;background:rgba(255,255,255,0.05);border-radius:7px;padding:2px}
.pv-mode button{background:none;border:none;color:rgba(255,255,255,0.5);padding:5px 11px;border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer}
.pv-mode button:hover{color:white}
.pv-mode button.on{color:white}
.pv-mode button.on[data-mode=draft]{background:rgba(245,158,11,0.25);color:#fbbf24}
.pv-mode button.on[data-mode=live]{background:rgba(0,168,107,0.25);color:#34d399}
.pv-url{flex:1;background:rgba(255,255,255,0.05);border-radius:6px;padding:5px 10px;font-family:'SF Mono',Menlo,monospace;font-size:11px;color:rgba(255,255,255,0.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:80px}
.pv-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);padding:5px 9px;border-radius:6px;font-family:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px}
.pv-btn:hover{background:rgba(255,255,255,0.1);color:white}
.pv-frame{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto;background:#222}
.pv-frame iframe{background:white;border:none;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.3);transition:width 0.2s,height 0.2s}
.pv-frame.vp-desktop iframe{width:100%;height:calc(100vh - 100px);max-width:none}
.pv-frame.vp-tablet iframe{width:768px;height:1024px;max-width:100%}
.pv-frame.vp-mobile iframe{width:390px;height:844px;max-width:100%}

/* ── COLLECTION LIST VIEW ── */
.coll{padding:24px}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.coll-card{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;cursor:pointer;transition:all 0.15s}
.coll-card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(0,0,0,0.05)}
.coll-card-title{font-size:14px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coll-card-meta{font-size:11px;color:var(--mid);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coll-card-meta .pill{background:var(--off);padding:2px 8px;border-radius:999px;font-weight:500;font-size:10px}
.coll-card-meta .pill.draft{background:var(--amber-bg);color:var(--amber)}
.coll-card-meta .pill.published{background:var(--green-bg);color:var(--green)}
.coll-add{background:transparent;border:2px dashed var(--border);border-radius:var(--r-lg);padding:14px;cursor:pointer;color:var(--mid);font-family:inherit;display:flex;align-items:center;justify-content:center;font-size:13px;min-height:88px}
.coll-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:11px 20px;border-radius:980px;font-size:13px;z-index:5000;box-shadow:0 8px 24px rgba(0,0,0,0.3);display:none;align-items:center;gap:8px;max-width:90vw}
.toast.show{display:flex}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}

/* ── MODAL ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:4000;padding:24px}
.modal.show{display:flex}
.modal-card{background:white;border-radius:18px;padding:28px;max-width:480px;width:100%}
.modal-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:6px}
.modal-body{font-size:13.5px;color:var(--mid);line-height:1.5;margin-bottom:18px}
.modal-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--mid);font-size:13px;font-weight:300;gap:10px}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 24px;color:var(--mid)}
.empty-title{font-size:16px;font-weight:500;color:var(--dark);margin-bottom:6px}
.empty-sub{font-size:13px;font-weight:300}

/* ── MOBILE / NARROW ── */
.mobile-bar{display:none;background:#111;padding:10px 14px;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:200}
.menu-btn{background:rgba(255,255,255,0.08);border:none;color:white;width:32px;height:32px;border-radius:7px;font-size:16px;cursor:pointer}
.mobile-title{font-family:'DM Serif Display',serif;font-size:17px;color:white}
.mobile-tabs{display:none;background:#1a1a1a;border-bottom:1px solid rgba(255,255,255,0.06)}
.mobile-tab{flex:1;background:none;border:none;color:rgba(255,255,255,0.5);padding:10px;font-family:inherit;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
.mobile-tab.on{color:white;border-bottom-color:var(--blue)}

@media (max-width: 900px){
  .sb{transform:translateX(-100%);transition:transform 0.2s;width:260px}
  .sb.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,0.5)}
  .main{margin-left:0;grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .mobile-bar{display:flex}
  .mobile-tabs{display:flex}
  .ed{display:none;border-right:none}
  .ed.show{display:flex}
  .pv{display:none}
  .pv.show{display:flex}
  .ed-header{padding:14px 16px 12px}
  .ed-body{padding:14px 16px 60px}
  .coll{padding:16px}
  .sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90}
  .sb-overlay.show{display:block}
  .pv-bar{padding:6px 8px;gap:5px}
  .pv-vp button,.pv-mode button{padding:5px 8px;font-size:10.5px}
  .pv-url{display:none}
  .pv-frame{padding:6px}
  .pv-frame.vp-tablet iframe,.pv-frame.vp-mobile iframe{max-width:100%;max-height:calc(100vh - 160px)}
}
@media (min-width: 901px){
  .mobile-bar,.mobile-tabs,.sb-overlay{display:none !important}
}
</style>
</head>
<body>

<!-- ─── LOGIN GATE ─── -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">Orion MIS</div>
    <div class="gate-sub">Content admin</div>

    <!-- Mode: signin (default) | recovery (set new password) | invite (accept invite) | forgot (request reset) -->
    <form id="gateForm" onsubmit="return false">
      <div class="gate-row" id="gateRowEmail">
        <label>Email</label>
        <input type="email" id="gEmail" autocomplete="username" required>
      </div>
      <div class="gate-row" id="gateRowPass">
        <label id="gPassLabel">Password</label>
        <input type="password" id="gPass" autocomplete="current-password" required>
      </div>
      <div class="gate-row" id="gateRowPass2" style="display:none">
        <label>Confirm password</label>
        <input type="password" id="gPass2" autocomplete="new-password">
      </div>
      <button type="submit" class="gate-btn" id="gateBtn" onclick="gateSubmit()">Sign in</button>
      <div class="gate-msg" id="gateMsg"></div>
    </form>

    <div class="gate-links">
      <a href="#" id="gateForgot" onclick="setGateMode('forgot');return false">Forgot password?</a>
      <a href="#" id="gateBackLink" style="display:none" onclick="setGateMode('signin');return false">← Back to sign in</a>
    </div>

    <div class="gate-hint">Access is invite-only. If you haven't received an invitation, ask Danny.</div>
  </div>
</div>

<!-- ─── APP ─── -->
<div id="app">

  <!-- Mobile bar -->
  <div class="mobile-bar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="mobile-title">Orion MIS</div>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar(false)"></div>

  <!-- Sidebar -->
  <aside class="sb" id="sb">
    <div class="sb-logo">
      <div class="sb-logo-m">Orion MIS</div>
      <div class="sb-logo-s">Content admin</div>
    </div>

    <div class="sb-sec">Pages</div>
    <button class="nb" data-route="page:homepage"><svg viewBox="0 0 24 24"><path d="M3 12 12 3l9 9M5 10v10h14V10"/></svg> Homepage</button>
    <button class="nb" data-route="page:helix-product"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg> Helix Product</button>
    <button class="nb" data-route="page:solutions"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg> Solutions</button>
    <button class="nb" data-route="page:about"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5 22c0-4 3-7 7-7s7 3 7 7"/></svg> About</button>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'untitled'}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function deepEqual(a,b){return JSON.stringify(a)===JSON.stringify(b)}

function toast(msg, kind=''){
  const t = document.getElementById('toast');
  t.className = 'toast show' + (kind ? ' '+kind : '');
  t.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{t.classList.remove('show')}, 3500);
}

function modal(title, body, okLabel='OK', danger=false){
  return new Promise(resolve => {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = body;
    const ok = document.getElementById('modalOk');
    ok.textContent = okLabel;
    ok.className = 'btn ' + (danger ? 'btn-dark' : 'btn-dark');
    ok.style.background = danger ? 'var(--red)' : '';
    document.getElementById('modal').classList.add('show');
    modal._resolve = resolve;
  });
}
function modalClose(result){
  document.getElementById('modal').classList.remove('show');
  if (modal._resolve) { modal._resolve(result); modal._resolve = null; }
}

// Base64 encode/decode that handles UTF-8 properly
function b64encode(str){return btoa(unescape(encodeURIComponent(str)))}
function b64decode(str){return decodeURIComponent(escape(atob(str)))}

// ════════════════════════════════════════════════════════════════════
// 4. AUTH — direct Netlify Identity (GoTrue) API, no widget
// ════════════════════════════════════════════════════════════════════

const ID_API = '/.netlify/identity';       // Identity endpoint on this site
const TOKEN_KEY = 'orion_identity_v1';     // localStorage key for tokens

let gateMode = 'signin';                   // 'signin' | 'forgot' | 'recovery' | 'invite'
let pendingToken = null;                   // recovery/invite token from URL hash

// ── Token storage ────────────────────────────────────────────────
function saveTokens(tok){
  // tok = { access_token, refresh_token, expires_at, ... }
  localStorage.setItem(TOKEN_KEY, JSON.stringify(tok));
}
function loadTokens(){
  try { return JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch(e){ return null; }
}
function clearTokens(){ localStorage.removeItem(TOKEN_KEY); }

// ── Low-level Identity API call ──────────────────────────────────
async function idFetch(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const res = await fetch(ID_API + path, Object.assign({}, opts, {headers}));
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok) {
    const msg = (data && (data.error_description || data.msg || data.error)) || res.statusText;
    const err = new Error(msg);
    err.status = res.status; err.body = data;
    throw err;
  }
  return data;
}

// ── Sign in with email/password ──────────────────────────────────
async function apiSignIn(email, password){
  // GoTrue token endpoint expects form-encoded body
  const body = new URLSearchParams({grant_type:'password', username:email, password:password});
  const res = await fetch(ID_API + '/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: body.toString(),
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) {
    const msg = data.error_description || data.error_message || data.msg || data.error || 'Sign-in failed';
    throw new Error(msg);
  }
  // Compute absolute expiry timestamp
  if (data.expires_in) data.expires_at = Date.now() + (data.expires_in * 1000);
  saveTokens(data);
  return data;
}

// ── Refresh access token ─────────────────────────────────────────
async function apiRefresh(refreshToken){
  const body = new URLSearchParams({grant_type:'refresh_token', refresh_token: refreshToken});
  const res = await fetch(ID_API + '/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: body.toString(),
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error_description || data.error || 'Refresh failed');
  if (data.expires_in) data.expires_at = Date.now() + (data.expires_in * 1000);
  saveTokens(data);
  return data;
}

// ── Get current user profile ─────────────────────────────────────
async function apiGetUser(accessToken){
  return await idFetch('/user', {
    headers: {'Authorization':'Bearer ' + accessToken},
  });
}

// ── Forgot password (request reset email) ────────────────────────
async function apiRequestReset(email){
  return await idFetch('/recover', {
    method:'POST',
    body: JSON.stringify({email}),
  });
}

// ── Verify recovery / invite token → returns an access_token ─────
async function apiVerifyToken(type, token){
  // type is 'recovery' or 'invite' or 'signup'
  return await idFetch('/verify', {
    method:'POST',
    body: JSON.stringify({type, token}),
  });
}

// ── Update password (must be authenticated) ──────────────────────
async function apiUpdatePassword(accessToken, password){
  return await idFetch('/user', {
    method:'PUT',
    headers: {'Authorization':'Bearer ' + accessToken},
    body: JSON.stringify({password}),
  });
}

// ── Sign out ─────────────────────────────────────────────────────
async function apiLogout(accessToken){
  try {
    await fetch(ID_API + '/logout', {
      method:'POST',
      headers: {'Authorization':'Bearer ' + accessToken},
    });
  } catch(e){}
}

// ════════════════════════════════════════════════════════════════════
// Gate UI — switches between sign-in / forgot / recovery / invite modes
// ════════════════════════════════════════════════════════════════════

function setGateMode(mode){
  gateMode = mode;
  const lbl = document.getElementById('gPassLabel');
  const rowEmail = document.getElementById('gateRowEmail');
  const rowPass = document.getElementById('gateRowPass');
  const rowPass2 = document.getElementById('gateRowPass2');
  const btn = document.getElementById('gateBtn');
  const forgot = document.getElementById('gateForgot');
  const back = document.getElementById('gateBackLink');
  const msg = document.getElementById('gateMsg');
  msg.textContent = ''; msg.className = 'gate-msg';

  if (mode === 'signin') {
    rowEmail.style.display = ''; rowPass.style.display = ''; rowPass2.style.display = 'none';
    lbl.textContent = 'Password'; btn.textContent = 'Sign in';
    forgot.style.display = ''; back.style.display = 'none';
  } else if (mode === 'forgot') {
    rowEmail.style.display = ''; rowPass.style.display = 'none'; rowPass2.style.display = 'none';
    btn.textContent = 'Send reset email';
    forgot.style.display = 'none'; back.style.display = '';
  } else if (mode === 'recovery' || mode === 'invite') {
    rowEmail.style.display = 'none'; rowPass.style.display = ''; rowPass2.style.display = '';
    lbl.textContent = 'New password';
    btn.textContent = mode === 'invite' ? 'Set password & continue' : 'Set new password';
    forgot.style.display = 'none'; back.style.display = '';
    msg.className = 'gate-msg info';
    msg.textContent = mode === 'invite' ? 'Welcome! Set a password to finish setting up your account.' : 'Set a new password for your account.';
  }
}

async function gateSubmit(){
  const msg = document.getElementById('gateMsg');
  const btn = document.getElementById('gateBtn');
  const originalLabel = btn.textContent;
  msg.textContent = ''; msg.className = 'gate-msg';
  btn.disabled = true; btn.textContent = 'Please wait…';

  try {
    if (gateMode === 'signin') {
      const email = document.getElementById('gEmail').value.trim();
      const password = document.getElementById('gPass').value;
      if (!email || !password) throw new Error('Enter your email and password');
      const tok = await apiSignIn(email, password);
      const user = await apiGetUser(tok.access_token);
      handleLogin(user, tok);
    }
    else if (gateMode === 'forgot') {
      const email = document.getElementById('gEmail').value.trim();
      if (!email) throw new Error('Enter your email');
      await apiRequestReset(email);
      msg.className = 'gate-msg ok';
      msg.textContent = 'If that email is registered, a reset link has been sent. Check inbox & spam.';
    }
    else if (gateMode === 'recovery' || gateMode === 'invite') {
      const p1 = document.getElementById('gPass').value;
      const p2 = document.getElementById('gPass2').value;
      if (!p1 || p1.length < 8) throw new Error('Password must be at least 8 characters');
      if (p1 !== p2) throw new Error('Passwords do not match');
      // Verify the token → returns an access token granting permission to update the user
      const tok = await apiVerifyToken(gateMode, pendingToken);
      await apiUpdatePassword(tok.access_token, p1);
      // The access_token from /verify is short-lived; trade it for a proper session by signing in with the
      // refresh_token (GoTrue returns one alongside the access_token)
      if (tok.expires_in) tok.expires_at = Date.now() + tok.expires_in*1000;
      saveTokens(tok);
      const user = await apiGetUser(tok.access_token);
      // Clean the URL
      history.replaceState(null, '', window.location.pathname);
      pendingToken = null;
      handleLogin(user, tok);
    }
  } catch (e) {
    msg.className = 'gate-msg err';
    msg.textContent = (e.message || 'Something went wrong').replace(/^Error:\s*/,'');
  } finally {
    btn.disabled = false; btn.textContent = originalLabel;
  }
}

// Allow Enter to submit on any field
function _attachGateEnter(){
  ['gEmail','gPass','gPass2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); gateSubmit(); }});
  });
}

// Login / logout / session restore
// ────────────────────────────────────────────────────────────────────

function handleLogin(user, tokens){
  currentUser = user;
  if (tokens) saveTokens(tokens);
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  const name = (user.user_metadata && user.user_metadata.full_name) || user.email.split('@')[0];
  document.getElementById('sbName').textContent = name;
  document.getElementById('sbEmail').textContent = user.email;
  document.getElementById('sbAv').textContent = name.charAt(0).toUpperCase();

  testGitGateway();
  refreshDraftIndex().then(() => {
    if (!route) navigate('page:homepage');
    else applyRouteUi();
  });
}
function handleLogout(){
  currentUser = null;
  clearTokens();
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  setGateMode('signin');
}
async function signOut(){
  const tok = loadTokens();
  if (tok && tok.access_token) await apiLogout(tok.access_token);
  handleLogout();
}

// jwt() returns a valid access_token, refreshing if needed
async function jwt(){
  let tok = loadTokens();
  if (!tok || !tok.access_token) throw new Error('Not signed in');
  // Refresh if expiring within 60s
  if (tok.expires_at && Date.now() > tok.expires_at - 60000 && tok.refresh_token) {
    tok = await apiRefresh(tok.refresh_token);
  }
  return tok.access_token;
}

// ────────────────────────────────────────────────────────────────────
// On page load: detect URL hash tokens, restore session, or show gate
// ────────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', async () => {
  _attachGateEnter();

  // 1. URL hash contains invite_token / recovery_token / confirmation_token / access_token
  const hash = window.location.hash || '';
  if (hash.includes('invite_token=') || hash.includes('recovery_token=') || hash.includes('confirmation_token=')) {
    const params = new URLSearchParams(hash.slice(1));
    if (params.get('invite_token')) {
      pendingToken = params.get('invite_token');
      setGateMode('invite');
      return;
    }
    if (params.get('recovery_token')) {
      pendingToken = params.get('recovery_token');
      setGateMode('recovery');
      return;
    }
    if (params.get('confirmation_token')) {
      // Confirm signup (rare with invite-only) — just sign in after
      try {
        await apiVerifyToken('signup', params.get('confirmation_token'));
        history.replaceState(null, '', window.location.pathname);
        document.getElementById('gateMsg').className = 'gate-msg ok';
        document.getElementById('gateMsg').textContent = 'Email confirmed. Please sign in.';
      } catch(e) {
        document.getElementById('gateMsg').className = 'gate-msg err';
        document.getElementById('gateMsg').textContent = 'Confirmation link expired or invalid.';
      }
      setGateMode('signin');
      return;
    }
  }

  // 2. Existing session?
  const tok = loadTokens();
  if (tok && tok.access_token) {
    try {
      // If expired and we have a refresh token, refresh first
      if (tok.expires_at && Date.now() > tok.expires_at - 60000 && tok.refresh_token) {
        await apiRefresh(tok.refresh_token);
      }
      const accessToken = loadTokens().access_token;
      const user = await apiGetUser(accessToken);
      handleLogin(user, null);
      return;
    } catch (e) {
      clearTokens();
    }
  }

  // 3. Default to sign-in gate
  setGateMode('signin');
});

// ════════════════════════════════════════════════════════════════════
// 5. GIT GATEWAY — file read/write through Netlify-proxied GitHub API
// ════════════════════════════════════════════════════════════════════

async function ggFetch(path, opts={}){
  const token = await jwt();
  const headers = Object.assign({
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github.v3+json',
  }, opts.headers || {});
  if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  const res = await fetch(GIT_GW + path, Object.assign({}, opts, {headers}));
  return res;
}

// GET file → {sha, content}|null
async function gitGetFile(filePath){
  const res = await ggFetch(`/contents/${encodeURI(filePath)}?ref=${BRANCH}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Read failed: ${filePath} (${res.status})`);
  const data = await res.json();
  let content = '';
  try { content = b64decode((data.content || '').replace(/\n/g,'')); } catch(e){ content = ''; }
  return { sha: data.sha, content };
}

// PUT (create or update) a file
async function gitPutFile(filePath, content, commitMsg){
  const existing = await gitGetFile(filePath);
  const body = {
    message: commitMsg || `Update ${filePath}`,
    content: b64encode(content),
    branch: BRANCH,
  };
  if (existing) body.sha = existing.sha;
  const res = await ggFetch(`/contents/${encodeURI(filePath)}`, {
    method: 'PUT',
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({message:res.statusText}));
    throw new Error(`Save failed: ${err.message || res.statusText}`);
  }
  return await res.json();
}

// DELETE a file
async function gitDeleteFile(filePath, commitMsg){
  const existing = await gitGetFile(filePath);
  if (!existing) return; // already gone
  const res = await ggFetch(`/contents/${encodeURI(filePath)}`, {
    method: 'DELETE',
    body: JSON.stringify({
      message: commitMsg || `Delete ${filePath}`,
      sha: existing.sha,
      branch: BRANCH,
    }),
  });
  if (!res.ok && res.status !== 404) {
    const err = await res.json().catch(()=>({message:res.statusText}));
    throw new Error(`Delete failed: ${err.message || res.statusText}`);
  }
}

// LIST a directory → array of {name, path, sha, type}
async function gitListDir(dirPath){
  const res = await ggFetch(`/contents/${encodeURI(dirPath)}?ref=${BRANCH}`);
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`List failed: ${dirPath}`);
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

// PUT a binary file (image) — accepts a base64 string already
async function gitPutBinary(filePath, base64Content, commitMsg){
  const existing = await gitGetFile(filePath).catch(()=>null);
  const body = {
    message: commitMsg || `Upload ${filePath}`,
    content: base64Content,
    branch: BRANCH,
  };
  if (existing) body.sha = existing.sha;
  const res = await ggFetch(`/contents/${encodeURI(filePath)}`, {
    method: 'PUT',
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({message:res.statusText}));
    throw new Error(`Upload failed: ${err.message || res.statusText}`);
  }
  return await res.json();
}

async function testGitGateway(){
  setGhStatus('connecting', 'Connecting…');
  try {
    const res = await ggFetch(`/contents/_data/global.json?ref=${BRANCH}`);
    if (res.ok) { setGhStatus('ok', 'Connected'); return true; }
    if (res.status === 401 || res.status === 403) {
      setGhStatus('err', 'Auth failed — re-sign-in');
      return false;
    }
    setGhStatus('err', `HTTP ${res.status}`);
    return false;
  } catch (e) {
    setGhStatus('err', 'Network error');
    return false;
  }
}
function setGhStatus(kind, msg){
  const dot = document.getElementById('ghDot');
  const txt = document.getElementById('ghStat');
  dot.className = 'dot' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
  txt.textContent = msg;
}

// ════════════════════════════════════════════════════════════════════
// 6. DATA HELPERS — read live & draft, list drafts
// ════════════════════════════════════════════════════════════════════

// Fast public read (no auth needed for public site)
async function readPublic(filePath){
  const url = SITE_ORIGIN + '/' + filePath + '?v=' + Date.now();
  const res = await fetch(url);
  if (!res.ok) return null;
  return await res.json();
}

// Read draft from git (drafts live under _data/_drafts/...)
function draftPathFor(livePath){
  // _data/homepage.json → _data/_drafts/homepage.json
  // _data/pages/about.json → _data/_drafts/pages/about.json
  // _data/news/2025-foo.json → _data/_drafts/news/2025-foo.json
  return livePath.replace(/^_data\//, '_data/_drafts/');
}

async function readDraftJson(livePath){
  const dPath = draftPathFor(livePath);
  const file = await gitGetFile(dPath);
  if (!file) return null;
  try { return JSON.parse(file.content); } catch(e){ return null; }
}

async function readLiveJson(livePath){
  // Prefer fast public read; fall back to git if not deployed yet.
  const pub = await readPublic(livePath);
  if (pub) return pub;
  const file = await gitGetFile(livePath);
  if (file) {
    try { return JSON.parse(file.content); } catch(e){}
  }
  // Legacy fallback: try _data/pages.json
  // Maps:
  //   _data/homepage.json           ← pages.json.homepage
  //   _data/pages/<id>.json         ← pages.json.<id>
  //   _data/global.json             ← pages.json.global (rare)
  let legacyKey = null;
  if (livePath === '_data/homepage.json') legacyKey = 'homepage';
  else if (livePath.startsWith('_data/pages/')) legacyKey = livePath.replace('_data/pages/','').replace('.json','');
  if (legacyKey) {
    const legacy = await readPublic('_data/pages.json');
    if (legacy && legacy[legacyKey]) return legacy[legacyKey];
  }
  return null;
}

// Refresh which pages have drafts (sidebar amber dots)
async function refreshDraftIndex(){
  draftIndex = new Set();
  try {
    // Top-level _data/_drafts/
    const top = await gitListDir('_data/_drafts').catch(()=>[]);
    for (const item of top) {
      if (item.type === 'file' && item.name.endsWith('.json')) {
        // _data/_drafts/homepage.json → homepage
        draftIndex.add(item.name.replace(/\.json$/,''));
      } else if (item.type === 'dir' && item.name === 'pages') {
        const inner = await gitListDir('_data/_drafts/pages').catch(()=>[]);
        for (const f of inner) {
          if (f.type === 'file' && f.name.endsWith('.json')) {
            draftIndex.add(f.name.replace(/\.json$/,''));
          }
        }
      }
    }
  } catch (e) {
    // not fatal
  }
  renderDraftDots();
}
function renderDraftDots(){
  document.querySelectorAll('.nb').forEach(btn => {
    const old = btn.querySelector('.drafted');
    if (old) old.remove();
    const r = btn.getAttribute('data-route');
    if (!r || !r.startsWith('page:')) return;
    const id = r.slice(5);
    if (draftIndex.has(id)) {
      const dot = document.createElement('span');
      dot.className = 'drafted';
      dot.title = 'Unpublished draft';
      btn.appendChild(dot);
    }
  });
}

async function navigate(routeStr){
  if (editorDirty) {
    const ok = await modal('Unsaved changes', 'You have unsaved changes. Discard them and continue?', 'Discard', true);
    if (!ok) return;
  }
  editorDirty = false;
  if (routeStr.startsWith('page:')) {
    route = { kind:'page', id: routeStr.slice(5) };
  } else if (routeStr.startsWith('coll:')) {
    route = { kind:'coll', id: routeStr.slice(5) };
  } else if (routeStr.startsWith('item:')) {
    const parts = routeStr.slice(5).split('/');
    route = { kind:'item', coll: parts[0], slug: parts.slice(1).join('/') };
  } else if (routeStr === 'new-item') {
    // Handled inline
    return;
  }
  applyRouteUi();
}

function applyRouteUi(){
  // Sidebar active
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  let activeRoute = null;
  if (route.kind === 'page') activeRoute = 'page:' + route.id;
  else if (route.kind === 'coll' || route.kind === 'item') activeRoute = 'coll:' + (route.coll || route.id);
  if (activeRoute) {
    const btn = document.querySelector(`.nb[data-route="${activeRoute}"]`);
    if (btn) btn.classList.add('on');
  }

  // Mobile: close sidebar after pick
  if (window.innerWidth <= 900) toggleSidebar(false);

  if (route.kind === 'page') return renderPageEditor(route.id);
  if (route.kind === 'coll') return renderCollectionList(route.id);
  if (route.kind === 'item') return renderCollectionItem(route.coll, route.slug);
}

// 8. PAGE EDITOR — single-file page with draft/live state
// ════════════════════════════════════════════════════════════════════

async function renderPageEditor(pageId){
  const schema = PAGES[pageId];
  if (!schema) {
    document.getElementById('ed').innerHTML = `<div class="empty"><div class="empty-title">Unknown page</div></div>`;
    return;
  }

  // Loading state
  document.getElementById('ed').innerHTML = `
    <div class="ed-header">
      <div class="ed-title">${esc(schema.label)}</div>
      <div class="ed-sub">Loading…</div>
    </div>
    <div class="ed-body"><div class="loading"><div class="spin"></div> Loading content</div></div>`;

  // Load draft + live in parallel
  const [draftData, liveData] = await Promise.all([
    readDraftJson(schema.file),
    readLiveJson(schema.file),
  ]);

  const hasDraft = draftData !== null;
  const hasLive = liveData !== null;
  editorData = deepClone(draftData || liveData || {});
  editorMeta = {
    pageId,
    schema,
    file: schema.file,
    draftFile: draftPathFor(schema.file),
    hasDraft,
    hasLive,
    liveSnapshot: liveData ? deepClone(liveData) : null,
    initial: deepClone(editorData),
  };
  editorDirty = false;

  drawPageEditor();
  updatePreview();
}

function drawPageEditor(){
  const m = editorMeta;
  const ed = document.getElementById('ed');
  const badge = m.hasDraft
    ? '<span class="badge draft">Draft</span>'
    : (m.hasLive ? '<span class="badge live">Live</span>' : '<span class="badge draft">New</span>');
  const dirtyMark = editorDirty ? ' <span style="color:var(--amber);font-size:11px;font-weight:500;margin-left:8px">● Unsaved</span>' : '';

  ed.innerHTML = `
    <div class="ed-header">
      <div class="ed-title">${esc(m.schema.label)} ${badge}${dirtyMark}</div>
      <div class="ed-sub">${esc(m.file)}</div>
      <div class="ed-actions">
        <button class="btn btn-blue" onclick="saveDraft()" ${!editorDirty && m.hasDraft ? 'disabled' : ''}>💾 Save draft</button>
        <button class="btn btn-green" onclick="publishDraft()" ${!m.hasDraft && !editorDirty ? 'disabled' : ''}>↗ Publish</button>
        ${m.hasDraft ? '<button class="btn btn-danger" onclick="discardDraft()">Discard draft</button>' : ''}
        <button class="btn btn-ghost" onclick="resetForm()">↺ Reset</button>
      </div>
    </div>
    <div class="ed-body" id="edBody"></div>`;

  renderFields(m.schema.fields, editorData, document.getElementById('edBody'));
}

function resetForm(){
  if (!editorMeta) return;
  editorData = deepClone(editorMeta.initial);
  editorDirty = false;
  drawPageEditor();
  updatePreview();
}

async function saveDraft(){
  if (!editorMeta) return;
  const m = editorMeta;
  const btn = document.querySelector('.btn-blue');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin" style="border-color:rgba(255,255,255,0.3);border-top-color:white"></div> Saving…'; }
  try {
    const content = JSON.stringify(editorData, null, 2);
    await gitPutFile(m.draftFile, content, `Draft: update ${m.schema.label} (${currentUser.email})`);
    m.hasDraft = true;
    m.initial = deepClone(editorData);
    editorDirty = false;
    draftIndex.add(m.pageId);
    renderDraftDots();
    drawPageEditor();
    updatePreview();
    toast('Draft saved ✓', 'ok');
  } catch (e) {
    toast(e.message || 'Save failed', 'err');
    drawPageEditor();
  }
}

async function publishDraft(){
  if (!editorMeta) return;
  const m = editorMeta;
  // If there are unsaved changes, save them as the draft first
  if (editorDirty) {
    const content = JSON.stringify(editorData, null, 2);
    try { await gitPutFile(m.draftFile, content, `Draft: update ${m.schema.label} (${currentUser.email})`); m.hasDraft = true; m.initial = deepClone(editorData); editorDirty = false; }
    catch (e) { toast('Could not save before publishing: ' + e.message, 'err'); return; }
  }

  const ok = await modal('Publish to live site?', `This will replace the live ${m.schema.label} content. The site will rebuild in about 30 seconds.`, 'Publish', false);
  if (!ok) return;

  const btn = document.querySelector('.btn-green');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin" style="border-color:rgba(255,255,255,0.3);border-top-color:white"></div> Publishing…'; }
  try {
    // Copy draft content → live file
    const content = JSON.stringify(editorData, null, 2);
    await gitPutFile(m.file, content, `Publish: ${m.schema.label} (${currentUser.email})`);
    // Delete the draft
    await gitDeleteFile(m.draftFile, `Publish: clear draft for ${m.schema.label}`);
    m.hasDraft = false;
    m.hasLive = true;
    m.liveSnapshot = deepClone(editorData);
    m.initial = deepClone(editorData);
    draftIndex.delete(m.pageId);
    renderDraftDots();
    drawPageEditor();
    updatePreview();
    toast('Published ✓ Site will rebuild shortly', 'ok');
  } catch (e) {
    toast(e.message || 'Publish failed', 'err');
    drawPageEditor();
  }
}

async function discardDraft(){
  if (!editorMeta) return;
  const m = editorMeta;
  const ok = await modal('Discard draft?', 'Unpublished changes will be lost. The live version stays unchanged.', 'Discard', true);
  if (!ok) return;
  try {
    await gitDeleteFile(m.draftFile, `Discard draft: ${m.schema.label}`);
    m.hasDraft = false;
    editorData = m.liveSnapshot ? deepClone(m.liveSnapshot) : {};
    m.initial = deepClone(editorData);
    editorDirty = false;
    draftIndex.delete(m.pageId);
    renderDraftDots();
    drawPageEditor();
    updatePreview();
    toast('Draft discarded', 'ok');
  } catch (e) {
    toast(e.message || 'Discard failed', 'err');
  }
}

// ════════════════════════════════════════════════════════════════════
// 9. SCHEMA-DRIVEN FIELD RENDERER
// ════════════════════════════════════════════════════════════════════

function renderFields(fields, data, container, path=''){
  container.innerHTML = '';
  fields.forEach(field => {
    container.appendChild(renderField(field, data, path));
  });
}

function renderField(field, data, path){
  const wrap = document.createElement('div');
  wrap.className = 'fld';
  const fullPath = path ? `${path}.${field.name}` : field.name;
  const required = field.required !== false;
  const labelHtml = `<div class="fld-label">${esc(field.label)}${required ? '<span class="req">*</span>' : ''}</div>${field.hint ? `<div class="fld-hint">${esc(field.hint)}</div>` : ''}`;

  if (field.widget === 'string') {
    wrap.innerHTML = labelHtml;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'fi';
    input.value = data[field.name] || '';
    input.addEventListener('input', () => { data[field.name] = input.value; markDirty(); });
    wrap.appendChild(input);
  }
  else if (field.widget === 'text') {
    wrap.innerHTML = labelHtml;
    const ta = document.createElement('textarea');
    ta.className = 'fi';
    ta.value = data[field.name] || '';
    ta.addEventListener('input', () => { data[field.name] = ta.value; markDirty(); });
    wrap.appendChild(ta);
  }
  else if (field.widget === 'select') {
    wrap.innerHTML = labelHtml;
    const sel = document.createElement('select');
    sel.className = 'fi';
    const opts = field.options || [];
    if (!required) {
      const o = document.createElement('option'); o.value=''; o.textContent='(none)'; sel.appendChild(o);
    }
    opts.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      sel.appendChild(o);
    });
    sel.value = data[field.name] || field.default || (required ? opts[0] : '');
    if (!data[field.name] && field.default) data[field.name] = field.default;
    sel.addEventListener('change', () => { data[field.name] = sel.value; markDirty(); });
    wrap.appendChild(sel);
  }
  else if (field.widget === 'date') {
    wrap.innerHTML = labelHtml;
    const input = document.createElement('input');
    input.type = 'date';
    input.className = 'fi';
    // Accept either ISO or DD/MM/YYYY
    let val = data[field.name] || '';
    if (val && val.includes('/')) {
      const parts = val.split('/');
      if (parts.length === 3) val = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
    } else if (val) {
      val = String(val).slice(0,10);
    }
    input.value = val;
    input.addEventListener('change', () => { data[field.name] = input.value; markDirty(); });
    wrap.appendChild(input);
  }
  else if (field.widget === 'image') {
    wrap.innerHTML = labelHtml;
    wrap.appendChild(renderImageField(field, data));
  }
  else if (field.widget === 'list') {
    wrap.innerHTML = labelHtml;
    wrap.appendChild(renderListField(field, data));
  }
  else {
    wrap.innerHTML = labelHtml + `<div class="fld-hint">(Unsupported widget: ${esc(field.widget)})</div>`;
  }
  return wrap;
}

function markDirty(){
  editorDirty = true;
  // Light header update so user sees the unsaved marker, without redrawing whole form
  const title = document.querySelector('.ed-title');
  if (title && !title.querySelector('.unsaved-mark')) {
    const mark = document.createElement('span');
    mark.className = 'unsaved-mark';
    mark.style.cssText = 'color:var(--amber);font-size:11px;font-weight:500;margin-left:8px';
    mark.textContent = '● Unsaved';
    title.appendChild(mark);
  }
  // Enable the Save Draft button
  const sb = document.querySelector('.btn-blue');
  if (sb) sb.disabled = false;
  const pb = document.querySelector('.btn-green');
  if (pb) pb.disabled = false;
  // Debounced preview refresh
  clearTimeout(markDirty._t);
  markDirty._t = setTimeout(updatePreviewWithLocalData, 600);
}

// ────────────────────────────────────────────
// IMAGE FIELD
// ────────────────────────────────────────────

function renderImageField(field, data){
  const wrap = document.createElement('div');
  const val = data[field.name] || '';
  wrap.className = 'img-w' + (val ? ' has' : '');
  wrap.innerHTML = val
    ? `<img src="${esc(val)}" onerror="this.style.display='none'">
       <div class="img-url">${esc(val)}</div>
       <div class="img-w-row">
         <button class="btn btn-ghost" type="button" data-act="replace">Replace</button>
         <button class="btn btn-ghost" type="button" data-act="url">Use URL</button>
         <button class="btn btn-danger" type="button" data-act="clear">Remove</button>
       </div>`
    : `<div class="img-w-hint"><b>Drop image here</b> or click to upload<br>JPG, PNG, GIF, WEBP, SVG</div>
       <div class="img-w-row">
         <button class="btn btn-ghost" type="button" data-act="url">Paste URL instead</button>
       </div>`;
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  wrap.appendChild(fileInput);

  const openFilePicker = () => fileInput.click();
  const setUrl = (url) => {
    data[field.name] = url || '';
    markDirty();
    const parent = wrap.parentElement;
    const fresh = renderImageField(field, data);
    parent.replaceChild(fresh, wrap);
  };

  // Click anywhere (except buttons) opens picker
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (btn) {
      e.stopPropagation();
      const act = btn.getAttribute('data-act');
      if (act === 'replace') openFilePicker();
      else if (act === 'clear') setUrl('');
      else if (act === 'url') {
        const url = prompt('Image URL:', data[field.name] || '');
        if (url !== null) setUrl(url.trim());
      }
      return;
    }
    if (!val) openFilePicker();
  });

  // Drag & drop
  ['dragenter','dragover'].forEach(ev => wrap.addEventListener(ev, e => { e.preventDefault(); wrap.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => wrap.addEventListener(ev, e => { e.preventDefault(); wrap.classList.remove('drag'); }));
  wrap.addEventListener('drop', async (e) => {
    const file = e.dataTransfer.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    await uploadImage(file, setUrl);
  });
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await uploadImage(file, setUrl);
  });
  return wrap;
}

async function uploadImage(file, setUrl){
  if (file.size > 5 * 1024 * 1024) {
    toast('Image is over 5MB — please compress first', 'err');
    return;
  }
  toast('Uploading image…');
  try {
    const base64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1]);
      r.onerror = () => reject(new Error('Could not read file'));
      r.readAsDataURL(file);
    });
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const base = slugify(file.name.replace(/\.[^.]+$/,'')).slice(0,40) || 'image';
    const ts = Date.now().toString(36);
    const filename = `${ts}-${base}.${ext}`;
    const path = `images/uploads/${filename}`;
    await gitPutBinary(path, base64, `Upload image: ${filename} (${currentUser.email})`);
    setUrl('/' + path);
    toast('Image uploaded ✓', 'ok');
  } catch (e) {
    toast(e.message || 'Upload failed', 'err');
  }
}

// ────────────────────────────────────────────
// LIST FIELD (repeating sections)
// ────────────────────────────────────────────

function renderListField(field, data){
  if (!Array.isArray(data[field.name])) data[field.name] = [];
  const arr = data[field.name];

  const wrap = document.createElement('div');
  wrap.className = 'list-wrap';

  const draw = () => {
    wrap.innerHTML = '';
    if (!arr.length) {
      const e = document.createElement('div');
      e.className = 'list-empty';
      e.textContent = 'No items yet';
      wrap.appendChild(e);
    }
    arr.forEach((item, i) => {
      const li = document.createElement('div');
      li.className = 'list-item';
      const summary = renderSummary(field.summary, item) || `Item ${i+1}`;
      const head = document.createElement('div');
      head.className = 'list-head';
      head.innerHTML = `
        <span class="list-grip">⋮⋮</span>
        <span class="list-num">${i+1}</span>
        <span class="list-summary">${esc(summary)}</span>
        <span class="list-controls">
          <button class="list-ctrl" data-act="up" ${i===0?'disabled':''}>↑</button>
          <button class="list-ctrl" data-act="down" ${i===arr.length-1?'disabled':''}>↓</button>
          <button class="list-ctrl danger" data-act="del">✕</button>
        </span>`;
      head.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-act]');
        if (btn) {
          e.stopPropagation();
          const act = btn.getAttribute('data-act');
          if (act === 'up' && i > 0) { [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; markDirty(); draw(); }
          if (act === 'down' && i < arr.length-1) { [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; markDirty(); draw(); }
          if (act === 'del') {
            modal('Remove item?', 'This will be undone if you reset.', 'Remove', true).then(ok => {
              if (ok) { arr.splice(i,1); markDirty(); draw(); }
            });
          }
          return;
        }
        li.classList.toggle('open');
      });
      li.appendChild(head);

      const body = document.createElement('div');
      body.className = 'list-body';
      renderFields(field.fields, item, body);
      li.appendChild(body);
      wrap.appendChild(li);
    });

    if (!field.max || arr.length < field.max) {
      const addBtn = document.createElement('button');
      addBtn.className = 'list-add';
      addBtn.type = 'button';
      addBtn.textContent = '+ Add item';
      addBtn.addEventListener('click', () => {
        const newItem = {};
        field.fields.forEach(f => {
          if (f.widget === 'list') newItem[f.name] = [];
          else if (f.default !== undefined) newItem[f.name] = f.default;
          else newItem[f.name] = '';
        });
        arr.push(newItem);
        markDirty();
        draw();
        // open the newly added item
        setTimeout(() => {
          const items = wrap.querySelectorAll('.list-item');
          const last = items[items.length-1];
          if (last) last.classList.add('open');
        }, 0);
      });
      wrap.appendChild(addBtn);
    }
  };

  draw();
  return wrap;
}

function renderSummary(template, item){
  if (!template || !item) return '';
  return template.replace(/\{\{(\w+)\}\}/g, (_, k) => String(item[k] || '').trim()).trim();
}

// ════════════════════════════════════════════════════════════════════
// 10. COLLECTION LISTS (News / Social / Vault)
// ════════════════════════════════════════════════════════════════════

async function renderCollectionList(collId){
  const schema = COLLECTIONS[collId];
  if (!schema) return;
  editorData = null; editorMeta = null; editorDirty = false;

  const ed = document.getElementById('ed');
  ed.innerHTML = `
    <div class="ed-header">
      <div class="ed-title">${esc(schema.label)}</div>
      <div class="ed-sub">${esc(schema.folder)}</div>
    </div>
    <div class="ed-body"><div class="loading"><div class="spin"></div> Loading items</div></div>`;

  try {
    // Read live items (from public site) + draft items (from git)
    const [live, draftDir] = await Promise.all([
      readPublic(schema.folder + '/index.json').then(idx => Promise.all(((idx && idx.files) || []).map(async f => {
        const data = await readPublic(schema.folder + '/' + f);
        return data ? Object.assign({}, data, { __file: f, __state: 'live' }) : null;
      }))).then(r => r.filter(Boolean)).catch(()=>[]),
      gitListDir(`_data/_drafts/${collId}`).catch(()=>[]),
    ]);

    // Load each draft file
    const draftItems = await Promise.all(draftDir.filter(d => d.type==='file' && d.name.endsWith('.json')).map(async d => {
      const f = await gitGetFile(`_data/_drafts/${collId}/${d.name}`);
      if (!f) return null;
      try { return Object.assign({}, JSON.parse(f.content), { __file: d.name, __state: 'draft' }); } catch(e){ return null; }
    }));

    // Merge: drafts override live by filename
    const byFile = new Map();
    live.forEach(it => byFile.set(it.__file, it));
    draftItems.filter(Boolean).forEach(it => {
      const existing = byFile.get(it.__file);
      it.__state = existing ? 'edited' : 'new-draft';
      byFile.set(it.__file, it);
    });
    const items = Array.from(byFile.values()).sort((a,b) => {
      // newest first by date if available
      const da = new Date(a.date || 0), db = new Date(b.date || 0);
      return db - da;
    });

    const body = document.createElement('div');
    body.className = 'coll';
    const grid = document.createElement('div');
    grid.className = 'coll-grid';

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'coll-card';
      const ident = item[schema.identifier] || item.title || item.name || item.caption || '(untitled)';
      const date = item.date ? new Date(item.date).toLocaleDateString('en-GB') : '';
      const statusPill = item.status ? `<span class="pill ${item.status}">${esc(item.status)}</span>` : '';
      const draftPill = item.__state === 'draft' ? '<span class="pill draft">draft only</span>'
                      : item.__state === 'edited' ? '<span class="pill draft">edited</span>'
                      : item.__state === 'new-draft' ? '<span class="pill draft">new draft</span>'
                      : '';
      card.innerHTML = `
        <div class="coll-card-title">${esc(ident)}</div>
        <div class="coll-card-meta">
          ${date ? `<span>${esc(date)}</span>` : ''}
          ${item.platform ? `<span class="pill">${esc(item.platform)}</span>` : ''}
          ${item.type ? `<span class="pill">${esc(item.type)}</span>` : ''}
          ${item.category ? `<span class="pill">${esc(item.category)}</span>` : ''}
          ${statusPill}
          ${draftPill}
        </div>`;
      card.addEventListener('click', () => navigate(`item:${collId}/${item.__file.replace(/\.json$/,'')}`));
      grid.appendChild(card);
    });

    const addCard = document.createElement('button');
    addCard.className = 'coll-add';
    addCard.innerHTML = `+ New ${esc(schema.label.replace(/&.*/, '').trim())} item`;
    addCard.addEventListener('click', () => createNewCollectionItem(collId));
    grid.appendChild(addCard);

    body.appendChild(grid);
    ed.querySelector('.ed-body').replaceWith(body);
  } catch (e) {
    ed.querySelector('.ed-body').innerHTML = `<div class="empty"><div class="empty-title">Couldn't load ${esc(schema.label)}</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }
  updatePreviewFor(schema.previewUrl);
}

function createNewCollectionItem(collId){
  const schema = COLLECTIONS[collId];
  const fresh = {};
  schema.fields.forEach(f => {
    if (f.widget === 'list') fresh[f.name] = [];
    else if (f.default !== undefined) fresh[f.name] = f.default;
    else if (f.widget === 'date') fresh[f.name] = new Date().toISOString().slice(0,10);
    else fresh[f.name] = '';
  });
  editorData = fresh;
  editorMeta = { collId, schema, slug: null, file: null, draftFile: null, hasDraft: false, hasLive: false, initial: deepClone(fresh), isNew: true };
  editorDirty = true;
  route = { kind:'item', coll: collId, slug: '__new__' };
  drawItemEditor();
  updatePreviewFor(schema.previewUrl);
}

async function renderCollectionItem(collId, slug){
  const schema = COLLECTIONS[collId];
  if (!schema) return;
  const filename = slug + '.json';
  const livePath = `${schema.folder}/${filename}`;
  const draftPath = `_data/_drafts/${collId}/${filename}`;

  document.getElementById('ed').innerHTML = `<div class="ed-header"><div class="ed-title">${esc(schema.label)}</div><div class="ed-sub">Loading…</div></div><div class="ed-body"><div class="loading"><div class="spin"></div> Loading item</div></div>`;

  const [draftFile, liveData] = await Promise.all([
    gitGetFile(draftPath),
    readPublic(livePath),
  ]);
  let draftData = null;
  if (draftFile) { try { draftData = JSON.parse(draftFile.content); } catch(e){} }

  const data = draftData || liveData || {};
  editorData = deepClone(data);
  editorMeta = {
    collId, schema, slug, filename, file: livePath, draftFile: draftPath,
    hasDraft: !!draftData, hasLive: !!liveData,
    liveSnapshot: liveData ? deepClone(liveData) : null,
    initial: deepClone(editorData),
    isNew: false,
  };
  editorDirty = false;
  drawItemEditor();
  updatePreviewFor(schema.previewUrl);
}

function drawItemEditor(){
  const m = editorMeta;
  const ed = document.getElementById('ed');
  const ident = editorData[m.schema.identifier] || '(new item)';
  const badge = m.isNew
    ? '<span class="badge draft">New</span>'
    : (m.hasDraft ? '<span class="badge draft">Draft</span>' : '<span class="badge live">Live</span>');

  ed.innerHTML = `
    <div class="ed-header">
      <div class="ed-title">${esc(ident || m.schema.label)} ${badge}</div>
      <div class="ed-sub">${esc(m.schema.label)} · ${esc(m.file || '(unsaved)')}</div>
      <div class="ed-actions">
        <button class="btn btn-ghost" onclick="navigate('coll:${m.collId}')">← Back</button>
        <button class="btn btn-blue" onclick="saveItemDraft()">💾 Save draft</button>
        <button class="btn btn-green" onclick="publishItem()">↗ Publish</button>
        ${m.hasDraft && !m.isNew ? '<button class="btn btn-danger" onclick="discardItemDraft()">Discard draft</button>' : ''}
        ${m.hasLive && !m.isNew ? '<button class="btn btn-danger" onclick="deleteItem()" style="margin-left:auto">🗑 Delete</button>' : ''}
      </div>
    </div>
    <div class="ed-body" id="edBody"></div>`;
  renderFields(m.schema.fields, editorData, document.getElementById('edBody'));
}

async function saveItemDraft(){
  const m = editorMeta;
  if (m.isNew && !editorData[m.schema.identifier]) {
    toast(`Please fill in "${m.schema.identifier}" before saving`, 'err'); return;
  }
  try {
    const slug = m.slug && m.slug !== '__new__' ? m.slug : m.schema.slug(editorData);
    const filename = slug + '.json';
    const draftPath = `_data/_drafts/${m.collId}/${filename}`;
    const content = JSON.stringify(editorData, null, 2);
    await gitPutFile(draftPath, content, `Draft: ${m.collId}/${filename} (${currentUser.email})`);
    m.slug = slug;
    m.filename = filename;
    m.file = `${m.schema.folder}/${filename}`;
    m.draftFile = draftPath;
    m.hasDraft = true;
    m.initial = deepClone(editorData);
    m.isNew = false;
    editorDirty = false;
    route = { kind:'item', coll: m.collId, slug };
    drawItemEditor();
    toast('Draft saved ✓', 'ok');
  } catch (e) {
    toast(e.message || 'Save failed', 'err');
  }
}

async function publishItem(){
  const m = editorMeta;
  if (!editorData[m.schema.identifier]) { toast(`Please fill in "${m.schema.identifier}" first`, 'err'); return; }
  const ok = await modal('Publish item?', `Publish "${editorData[m.schema.identifier]}" to the live site?`, 'Publish', false);
  if (!ok) return;
  try {
    const slug = m.slug && m.slug !== '__new__' ? m.slug : m.schema.slug(editorData);
    const filename = slug + '.json';
    const livePath = `${m.schema.folder}/${filename}`;
    const draftPath = `_data/_drafts/${m.collId}/${filename}`;
    const content = JSON.stringify(editorData, null, 2);
    await gitPutFile(livePath, content, `Publish ${m.collId}: ${editorData[m.schema.identifier]} (${currentUser.email})`);
    // Clear draft if any
    if (m.hasDraft) await gitDeleteFile(draftPath, `Clear draft for ${m.collId}/${filename}`).catch(()=>{});
    // Rebuild the collection's index.json
    await rebuildCollectionIndex(m.collId);
    m.slug = slug; m.filename = filename; m.file = livePath; m.draftFile = draftPath;
    m.hasDraft = false; m.hasLive = true;
    m.liveSnapshot = deepClone(editorData);
    m.initial = deepClone(editorData);
    m.isNew = false; editorDirty = false;
    route = { kind:'item', coll: m.collId, slug };
    drawItemEditor();
    toast('Published ✓ Site rebuilds in ~30s', 'ok');
  } catch (e) {
    toast(e.message || 'Publish failed', 'err');
  }
}

async function discardItemDraft(){
  const m = editorMeta;
  const ok = await modal('Discard draft?', 'Live version stays unchanged.', 'Discard', true);
  if (!ok) return;
  try {
    await gitDeleteFile(m.draftFile, `Discard draft: ${m.collId}/${m.filename}`);
    m.hasDraft = false;
    editorData = m.liveSnapshot ? deepClone(m.liveSnapshot) : {};
    m.initial = deepClone(editorData);
    editorDirty = false;
    drawItemEditor();
    toast('Draft discarded', 'ok');
  } catch (e) {
    toast(e.message || 'Discard failed', 'err');
  }
}

async function deleteItem(){
  const m = editorMeta;
  const ok = await modal('Delete item?', `This permanently removes "${editorData[m.schema.identifier]}" from the live site. The site will rebuild.`, 'Delete', true);
  if (!ok) return;
  try {
    if (m.hasLive) await gitDeleteFile(m.file, `Delete ${m.collId}: ${editorData[m.schema.identifier]} (${currentUser.email})`);
    if (m.hasDraft) await gitDeleteFile(m.draftFile, `Delete draft: ${m.collId}/${m.filename}`).catch(()=>{});
    await rebuildCollectionIndex(m.collId);
    toast('Deleted ✓', 'ok');
    navigate('coll:' + m.collId);
  } catch (e) {
    toast(e.message || 'Delete failed', 'err');
  }
}

// Rebuild _data/<coll>/index.json to list current files
async function rebuildCollectionIndex(collId){
  const schema = COLLECTIONS[collId];
  const items = await gitListDir(schema.folder);
  const files = items
    .filter(i => i.type === 'file' && i.name.endsWith('.json') && i.name !== 'index.json')
    .map(i => i.name)
    .sort()
    .reverse(); // newest filename first (date-prefixed)
  const indexPath = `${schema.folder}/index.json`;
  await gitPutFile(indexPath, JSON.stringify({ files }, null, 2), `Rebuild ${collId} index`);
}

// ════════════════════════════════════════════════════════════════════
// 11. PREVIEW PANE
// ════════════════════════════════════════════════════════════════════

function setVp(vp){
  pvVp = vp;
  document.querySelectorAll('.pv-vp button').forEach(b => b.classList.toggle('on', b.getAttribute('data-vp') === vp));
  const frame = document.getElementById('pvFrame');
  frame.className = 'pv-frame vp-' + vp;
}
function setPvMode(mode){
  pvMode = mode;
  document.querySelectorAll('.pv-mode button').forEach(b => b.classList.toggle('on', b.getAttribute('data-mode') === mode));
  updatePreview();
}
function refreshPreview(){ updatePreview(true); }
function openPreviewWindow(){
  const url = currentPreviewUrl();
  if (url) window.open(url, '_blank');
}
function currentPreviewUrl(){
  let path = '/index.html';
  if (route && route.kind === 'page' && PAGES[route.id]) path = PAGES[route.id].previewUrl;
  else if (route && (route.kind === 'coll' || route.kind === 'item')) path = COLLECTIONS[(route.coll||route.id)].previewUrl;
  const draftParam = pvMode === 'draft' ? (path.includes('?') ? '&_draft=1' : '?_draft=1') : '';
  return SITE_ORIGIN + path + draftParam;
}

function updatePreview(force){
  const url = currentPreviewUrl();
  document.getElementById('pvUrl').textContent = url.replace(SITE_ORIGIN,'');
  const iframe = document.getElementById('pvIframe');
  if (force || iframe.src !== url) {
    iframe.src = url;
  }
}

function updatePreviewFor(path){
  // Used by collection views
  const url = SITE_ORIGIN + path + (pvMode === 'draft' ? '?_draft=1' : '');
  document.getElementById('pvUrl').textContent = url.replace(SITE_ORIGIN,'');
  document.getElementById('pvIframe').src = url;
}

// Live preview of in-progress edits.
// The iframe runs cms.js which listens for `orion-cms-preview` postMessage and
// reapplies content without a rebuild. This means edits are reflected in the
// preview within ~600ms of typing, regardless of Netlify build state.
let _previewReady = false;
window.addEventListener('message', (ev) => {
  if (ev.data && ev.data.type === 'orion-cms-ready') {
    _previewReady = true;
    pushPreviewData();
  }
});
function pushPreviewData(){
  const iframe = document.getElementById('pvIframe');
  if (!iframe || !iframe.contentWindow || !_previewReady) return;
  if (!editorData || !route) return;
  const msg = { type: 'orion-cms-preview' };
  if (route.kind === 'page') {
    if (route.id === 'homepage') msg.homepage = editorData;
    else if (route.id === 'global') msg.global = editorData;
    else msg.page = editorData;
  }
  try { iframe.contentWindow.postMessage(msg, SITE_ORIGIN); } catch(e){}
}
function updatePreviewWithLocalData(){
  pushPreviewData();
}
// Re-push whenever iframe finishes loading
document.addEventListener('DOMContentLoaded', () => {
  const iframe = document.getElementById('pvIframe');
  if (iframe) iframe.addEventListener('load', () => {
    _previewReady = false; // wait for the new page's ready ping
  });
});

function toggleSidebar(force){
  const sb = document.getElementById('sb');
  const ov = document.getElementById('sbOverlay');
  const open = force === undefined ? !sb.classList.contains('open') : force;
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}
function mobileView(which){
  mobileMode = which;
  document.getElementById('ed').classList.toggle('show', which === 'ed');
  document.getElementById('pv').classList.toggle('show', which === 'pv');
  document.getElementById('mtEdit').classList.toggle('on', which === 'ed');
  document.getElementById('mtPv').classList.toggle('on', which === 'pv');
}

window.addEventListener('beforeunload', (e) => {
  if (editorDirty) { e.preventDefault(); e.returnValue = ''; }
});
